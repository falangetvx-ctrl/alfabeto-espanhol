<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfabeto Espanhol Retro</title>
    <!-- Carrega Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Carrega a biblioteca Tone.js para geração de som (simulação retrô) -->
    <script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>
    <style>
        /* Define a fonte mono para um visual retro e garante que a página ocupe toda a viewport */
        body {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            background-color: #1a1a2e; /* Fundo azul escuro (tema espacial/arcade) */
            padding: 0;
            margin: 0;
            perspective: 1500px;
        }
        
        /* NOVO: Canvas para o fundo de estrelas 3D */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-color: transparent; 
            transform: rotateX(10deg) translateZ(-50px);
            will-change: transform; 
        }

        /* Estilo do botão/quadrado da letra para o visual retrô */
        .letter-tile {
            position: relative;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 8px 0 0 #050510,
                        0 2px 4px rgba(0, 0, 0, 0.4) inset;
            border: 4px solid #f6d148;
            user-select: none;
            will-change: transform, box-shadow, filter;
            border-radius: 9999px;
            filter: brightness(1.05);
        }

        .letter-tile:active {
            transform: translateY(8px); 
            box-shadow: 0 0px 0 0 #050510, 
                        0 2px 4px rgba(0, 0, 0, 0.4) inset; 
            filter: brightness(0.9);
        }

        .bg-color-0 { background-color: #ff3366; }
        .bg-color-1 { background-color: #33ffcc; }
        .bg-color-2 { background-color: #ffcc33; }
        .bg-color-3 { background-color: #6633ff; }
        .bg-color-4 { background-color: #33ff66; }
        .bg-color-5 { background-color: #ff6633; }

        .letter-display {
            line-height: 1;
            text-shadow: 2px 2px 0 #0f0a1e;
        }

        #pronunciation-box {
            min-height: 8rem;
            transition: background-color 0.3s ease-in-out;
            background-color: #111111;
            border: 8px solid #0f0a1e;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5) inset;
            border-radius: 4px;
        }

        #current-pronunciation {
            color: #33ff66;
            text-shadow: 0 0 5px rgba(51, 255, 102, 0.8);
        }

        .text-glow {
            text-shadow: 0 0 5px #fff, 0 0 10px #f6d148, 0 0 15px #ff3366;
        }

        .full-screen-container {
            width: 100%;
            max-width: 100%;
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1.5rem;
            position: relative;
            z-index: 1;
        }

        #alphabet-grid {
            width: 100%;
            flex-grow: 1; 
            align-content: flex-start;
            transform: rotateX(10deg) translateZ(-50px);
            transform-style: preserve-3d;
        }

        /* ====== AJUSTE: Tela de explicação em tela cheia (modal) ====== */
        body.explain-open { overflow: hidden; }

        /* IMPORTANTE: por padrão fica escondido, para o VOLTAR funcionar */
        #explainOverlay{
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;                 /* <<< AJUSTE PRINCIPAL */
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(0,0,0,.72);
            backdrop-filter: blur(2px);
        }

        /* Quando estiver aberto, vira flex (tela cheia) */
        #explainOverlay.open{
            display: flex;                /* <<< AJUSTE PRINCIPAL */
        }

        #explainPanel{
            width: min(920px, 96vw);
            max-height: min(86vh, 820px);
            overflow: auto;
            background: #0b0f22;
            border: 6px solid #f6d148;
            box-shadow: 0 24px 80px rgba(0,0,0,.65);
            border-radius: 16px;
            padding: 18px 18px 16px;
        }

        #explainActions{
            display:flex;
            justify-content:center;
            margin-top: 14px;
        }

        #btnBack{
            cursor: pointer;
            border: 4px solid #0f0a1e;
            background: #f6d148;
            color: #0f0a1e;
            font-weight: 900;
            letter-spacing: .08em;
            padding: 10px 18px;
            border-radius: 999px;
            box-shadow: 0 8px 0 0 #050510;
            user-select: none;
        }

        #btnBack:active{
            transform: translateY(8px);
            box-shadow: 0 0px 0 0 #050510;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    
    <canvas id="starfield"></canvas>

    <!-- Overlay de explicação em tela cheia -->
    <div id="explainOverlay" aria-hidden="true">
        <div id="explainPanel">
            <div id="explainContent" class="text-center"></div>
            <div id="explainActions">
                <button id="btnBack" type="button">VOLTAR</button>
            </div>
        </div>
    </div>

    <div class="full-screen-container max-w-4xl">
        
        <header class="text-center mb-6 w-full">
            <h1 class="text-5xl sm:text-6xl text-white font-extrabold tracking-widest text-glow mb-2">
                ALFABETO ESPAÑOL
            </h1>
            <p class="text-lg sm:text-xl text-yellow-400 font-bold mb-4">
                Clique na letra ou dígrafo e veja como fica seu /som/ (nome) em espanhol.
            </p>
        </header>

        <div id="pronunciation-box" class="mb-6 p-6 sm:p-10 rounded-lg shadow-inner w-full">
            <p id="current-pronunciation" class="text-3xl sm:text-4xl text-center font-bold tracking-wider">
                INICIAR JOGO
            </p>
            <p class="text-xs sm:text-sm text-gray-400 text-center mt-1">
                Clique em qualquer botão abaixo para começar.
            </p>
        </div>

        <div id="alphabet-grid" class="grid grid-cols-5 sm:grid-cols-6 gap-3 sm:gap-4 pb-4"></div>

        <footer class="w-full flex justify-center mt-8 mb-4">
            <img 
                src="Gemini_Generated_Image_hrgq8chrgq8chrgq.png" 
                alt="Falange Educación Lúdica" 
                class="w-52 sm:w-64 drop-shadow-lg"
            >
        </footer>

    </div>

    <script type="module">
        const alphabet = [
            { letter: 'A', name: '/a/ (A)' },
            { letter: 'B', name: '/be/ (Be)' },
            { letter: 'C', name: '/se/ ou /ke/ (Ce) O "C" só tem som de "S" perto de "E e I"' },
            { letter: 'CH', name: '/tche/ (Che)' },
            { letter: 'D', name: '/de/ (De)' },
            { letter: 'E', name: '/e/ (E)' },
            { letter: 'F', name: '/fe/ (Efe)' },
            { letter: 'G', name: '/re/ ou /gue/ (Ge) O "G" só tem som de "R" perto de "E e I"' },
            { letter: 'H', name: '/sem som/ (Hache)' },
            { letter: 'I', name: '/i/ (I)' },
            { letter: 'J', name: '/re/ (Jota)' },
            { letter: 'K', name: '/ke/ (Ka)' },
            { letter: 'L', name: '/le/ (Ele)' },
            { letter: 'LL', name: '/lhe/ ou /ie/ ou /je/ ou /che/ ou /dje/ ou /tche/ (Elle ou doble ele)' },
            { letter: 'M', name: '/me/ (Eme)' },
            { letter: 'N', name: '/ne/ (Ene)' },
            { letter: 'Ñ', name: '/nhe/ (Eñe)' },
            { letter: 'O', name: '/o/ (o)' },
            { letter: 'P', name: '/pe/ (Pe)' },
            { letter: 'Q', name: '/ke/ (Cu)' },
            { letter: 'R', name: '/RE/ COM VIBRAÇÃO (Erre)' },
            { letter: 'RR', name: '/RE/ COM VIBRAÇÃO FORTE (Erre Forte ou Doble Erre)' },
            { letter: 'S', name: '/se/ (Ese)' },
            { letter: 'T', name: '/Te/ (Te)' },
            { letter: 'U', name: '/u/ (u)' },
            { letter: 'V', name: '/be/ (Uve ou Ve)' },
            { letter: 'W', name: '/u/ ou /be/ (Uve Doble ou Doble Ve)' },
            { letter: 'X', name: '/kse/ ou /re/ (Equis)' },
            { letter: 'Y', name: '/ie/ ou /je/ ou /che/ ou /dje/ ou /tche/ (Ye ou I Griega)' },
            { letter: 'Z', name: '/se/ (Zeta ou Ceta)' },
        ];

        let synth = null; 

        // Overlay (tela cheia)
        const explainOverlay = document.getElementById('explainOverlay');
        const explainContent = document.getElementById('explainContent');
        const btnBack = document.getElementById('btnBack');

        const openExplanation = (html) => {
            explainContent.innerHTML = html;
            explainOverlay.classList.add('open');           // <<< abre de verdade
            explainOverlay.setAttribute('aria-hidden', 'false');
            document.body.classList.add('explain-open');
        };

        const closeExplanation = () => {
            explainOverlay.classList.remove('open');        // <<< fecha de verdade
            explainOverlay.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('explain-open');
        };

        btnBack.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            closeExplanation();
        });

        const initializeAudio = async () => {
            if (Tone.context.state !== 'running') {
                await Tone.start();
            }
            if (!synth) {
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "square" },
                    envelope: { attack: 0.005, decay: 0.1, sustain: 0.01, release: 0.5 }
                }).toDestination();
                console.log("Audio Context e Synth inicializados.");
            }
        };

        const playLetter = async (letter, pronunciation, colorIndex) => {
            await initializeAudio();

            const pronunciationBox = document.getElementById('current-pronunciation');
            const boxContainer = document.getElementById('pronunciation-box');

            const displayLetter = letter.length > 1 ? `DÍGRAFO: ${letter}` : `LETRA: ${letter}`;

            pronunciationBox.innerHTML =
              `<span class="text-4xl sm:text-5xl text-yellow-400">#${displayLetter}</span>
               <span class="text-2xl sm:text-3xl text-green-400"> ${pronunciation}</span>`;

            // Abre a explicação em tela cheia (o resto permanece igual)
            openExplanation(`
                <div class="text-xs sm:text-sm text-gray-400 mb-2">EXPLICAÇÃO</div>
                <div class="text-3xl sm:text-4xl font-bold leading-snug">${pronunciationBox.innerHTML}</div>
                <div class="mt-3 text-xs sm:text-sm text-gray-400">Clique em <b>VOLTAR</b> para voltar aos botões.</div>
            `);

            boxContainer.classList.add('bg-gray-800', 'border-green-500');
            setTimeout(() => {
                boxContainer.classList.remove('bg-gray-800', 'border-green-500');
                boxContainer.classList.add('bg-gray-900');
            }, 150);

            const noteMap = {
                'A': 'C4', 'B': 'D4', 'C': 'E4', 'CH': 'F#4',
                'D': 'F4', 'E': 'G4', 'F': 'A4', 'G': 'B4',
                'H': 'C5', 'I': 'D5', 'J': 'E5', 'K': 'F5', 'L': 'G5', 
                'LL': 'A#5', 
                'M': 'A5', 'N': 'B5',
                'Ñ': 'C6', 'O': 'D6', 'P': 'E6', 'Q': 'F6', 'R': 'G6', 
                'RR': 'G#6', 
                'S': 'A6', 'T': 'B6',
                'U': 'C7', 'V': 'D7', 'W': 'E7', 'X': 'F7', 'Y': 'G7', 'Z': 'A7'
            };

            const note = noteMap[letter.toUpperCase()] || 'C4';
            if (synth) synth.triggerAttackRelease(note, "8n");
        };

        const renderGrid = () => {
            const grid = document.getElementById('alphabet-grid');
            grid.innerHTML = '';
            
            alphabet.forEach((item, index) => {
                const tile = document.createElement('div');
                const colorClass = `bg-color-${index % 6}`; 

                tile.className = `letter-tile p-3 flex items-center justify-center aspect-square text-white ${colorClass}`;
                const fontSizeClass = item.letter.length > 1 ? 'text-2xl' : 'text-3xl';
                tile.innerHTML = `<span class="letter-display font-black ${fontSizeClass}">${item.letter}</span>`;
                
                tile.addEventListener('click', () => {
                    playLetter(item.letter, item.name, index % 6);
                });

                grid.appendChild(tile);
            });
        };

        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let width, height;
        const numStars = 500;
        const stars = [];

        const starSpeed = 0.5;
        const maxStarZ = 500;

        const resizeCanvas = () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            stars.length = 0; 
            for (let i = 0; i < numStars; i++) {
                stars.push(createStar());
            }
        };

        function createStar() {
            return {
                x: Math.random() * width - width / 2,
                y: Math.random() * height - height / 2,
                z: Math.random() * maxStarZ,
                ox: 0,
                oy: 0,
            };
        }

        function animateStarfield() {
            ctx.clearRect(0, 0, width, height);

            ctx.save();
            ctx.translate(width / 2, height / 2);
            
            for (let star of stars) {
                star.z -= starSpeed;

                if (star.z <= 0) {
                    star.x = Math.random() * width - width / 2;
                    star.y = Math.random() * height - height / 2;
                    star.z = maxStarZ;
                    star.ox = 0;
                    star.oy = 0;
                }

                const perspective = maxStarZ / star.z;
                const projectedX = star.x * perspective;
                const projectedY = star.y * perspective;
                
                const radius = Math.max(0.5, 1.5 - (star.z / maxStarZ)); 
                
                ctx.beginPath();
                ctx.arc(projectedX, projectedY, radius, 0, Math.PI * 2);
                
                const brightness = Math.floor(255 - (star.z / maxStarZ) * 200); 
                ctx.fillStyle = `rgb(${brightness}, ${brightness}, ${brightness})`;
                ctx.fill();

                if (star.ox && star.oy) {
                    ctx.strokeStyle = `rgba(255, 255, 255, ${1 - (star.z / maxStarZ)})`;
                    ctx.lineWidth = radius * 1.5;
                    ctx.beginPath();
                    ctx.moveTo(projectedX, projectedY);
                    const projectedOX = star.ox * (maxStarZ / star.oz);
                    const projectedOY = star.oy * (maxStarZ / star.oz);
                    ctx.lineTo(projectedOX, projectedOY);
                    ctx.stroke();
                }

                star.ox = star.x;
                star.oy = star.y;
                star.oz = star.z;
            }

            ctx.restore();
            requestAnimationFrame(animateStarfield);
        }

        window.onload = function () {
            renderGrid();
            document.body.addEventListener('click', initializeAudio, { once: true });
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas(); 
            animateStarfield();
        };
    </script>
</body>
</html>
